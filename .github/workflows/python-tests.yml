name: Python test suite

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            src/tsmadkit/pyproject.toml
            src/tsmadalg/pyproject.toml

      # h5py has no Python 3.15 wheel yet, so pip builds it from source against the system HDF5
      - name: Install HDF5 library
        if: matrix.python-version == '3.15'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev pkg-config

      - name: Install packages and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "src/tsmadkit[dev]" -e "src/tsmadalg[dev,tools]"

      - name: Run tests
        run: python -m pytest tests

  coverage:
    name: Coverage badges
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Deployments push to the same gh-pages branch as the documentation, so they must not overlap
    concurrency:
      group: docs-deploy
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/tsmadkit/pyproject.toml
            src/tsmadalg/pyproject.toml

      - name: Install packages and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "src/tsmadkit[dev]" -e "src/tsmadalg[dev,tools]"

      # Each package is covered by its own tests only
      - name: Measure coverage
        run: |
          for package in tsmadkit tsmadalg; do
            python -m pytest tests/unit/$package --cov=$package --cov-report=json:coverage-$package.json
          done

      - name: Write the coverage badges
        run: python tests/write_coverage_badges.py badges tsmadkit tsmadalg

      - name: Deploy to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: badges
          destination_dir: badges
          keep_files: true  # keep the documentation
