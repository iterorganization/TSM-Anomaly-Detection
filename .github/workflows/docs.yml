name: Documentation

on:
  push:
    branches: [main, dev]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

# Deployments push to the same gh-pages branch, so they must not overlap
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  docs:
    name: Build and deploy documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # tags are needed to list the versions

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            src/tsmadkit/pyproject.toml
            src/tsmadalg/pyproject.toml

      - name: Install packages and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e src/tsmadkit -e src/tsmadalg -r docs/requirements.txt

      # main is published as "stable", dev as "dev", and tags as their version number
      - name: Select documentation version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            refs/heads/main) version="stable" ;;
            refs/heads/dev) version="dev" ;;
            *) echo "No documentation version for $GITHUB_REF"; exit 1 ;;
          esac
          echo "DOCS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build documentation
        run: sphinx-build -b html -d docs/build/doctrees docs/source "site/$DOCS_VERSION"

      - name: Write the version list
        run: python docs/write_versions.py site

      - name: Deploy to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true  # keep the other versions' folders
