[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tsmadkit"
description = "TSM Anomaly Detection Kit"
authors = [
    {name = "Joris Paret", email = "joris.paret@gmail.com"}
]
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "pydantic",
    "numpy",
    "h5py",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]
ml = [
    "joblib",
    "tensorflow",
    "scikit-learn"
]
analysis = [
    "pandas"
]

[tool.setuptools]
packages = ["tsmadkit"]

[tool.setuptools.dynamic]
version = {attr = "tsmadkit._version.__version__"}

[project.urls]
repository = "https://github.com/iterorganization/TSM-Anomaly-Detection"
